<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-code-agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <header>
            <div class="status-dot" id="statusDot"></div>

            <h1>mini-code-agent</h1>

            <span class="model-badge" id="modelBadge">
                carregando…
            </span>

            <div class="spacer"></div>

            <button
                class="icon-btn"
                id="filesToggle"
                title="Workspace"
                aria-label="Abrir workspace"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
                </svg>
            </button>

            <button
                class="icon-btn"
                id="clearBtn"
                title="Limpar conversa"
                aria-label="Limpar conversa"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/>
                </svg>
            </button>
        </header>

        <div id="body">

            <div id="chat-col">
                <div id="log"></div>

                <div id="inputBar">
                    <textarea
                        id="input"
                        placeholder="Peça algo, ex: crie um script hello.js"
                        rows="1"
                    ></textarea>

                    <button id="send">
                        enviar
                    </button>
                </div>
            </div>

            <div id="drawer">

                <div class="drawer-header">
                    <h2>
                        workspace <span class="path-hint">/</span>
                    </h2>

                    <button
                        class="icon-btn"
                        id="refreshTree"
                        title="Atualizar"
                        aria-label="Atualizar lista de arquivos"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>
                        </svg>
                    </button>

                    <button
                        class="icon-btn"
                        id="closeDrawer"
                        title="Fechar"
                        aria-label="Fechar workspace"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <div id="tree"></div>
            </div>
        </div>

        <div id="preview">

            <div class="preview-header">
                <span id="previewName"></span>

                <button
                    class="icon-btn"
                    id="closePreview"
                    aria-label="Fechar arquivo"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <pre id="previewContent"></pre>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
