<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-code-agent</title>
    <style>
        :root {
            --bg: #0d1013;
            --panel: #12161a;
            --border: #232a30;
            --text: #d9e0e6;
            --muted: #6b7684;
            --accent: #7ee787;
            --accent-dim: #3d5a41;
            --user: #79c0ff;
            --log-bg: #0a1210;
            --error: #f38ba8;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }
        header h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin: 0;
            color: var(--text);
        }
        header span {
            color: var(--muted);
            font-size: 12px;
        }
        #log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 100%;
            font-size: 13.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg .role {
            display: block;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .msg.user .role { color: var(--user); }
        .msg.agent .role { color: var(--accent); }
        .msg.error .role { color: var(--error); }
        .actions {
            margin: 6px 0;
            border: 1px solid var(--border);
            background: var(--log-bg);
            border-radius: 6px;
            overflow: hidden;
        }
        .action-line {
            padding: 7px 10px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
        }
        .action-line:last-child { border-bottom: none; }
        .action-line .cmd { color: var(--accent); }
        .action-line .cmd::before { content: "$ "; color: var(--accent-dim); }
        #inputBar {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }
        #inputBar textarea {
            flex: 1;
            resize: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 13.5px;
            padding: 10px 12px;
            min-height: 42px;
            max-height: 120px;
        }
        #inputBar textarea:focus { outline: 1px solid var(--accent); }
        #inputBar button {
            background: var(--accent);
            color: #06110a;
            border: none;
            border-radius: 6px;
            padding: 0 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            font-size: 13px;
        }
        #inputBar button:disabled { opacity: 0.5; }
        #inputBar button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="dot"></div>
            <h1>mini-code-agent</h1>
            <span>workspace</span>
        </header>
        <div id="log"></div>
        <div id="inputBar">
            <textarea id="input" placeholder="Peça algo, ex: crie um script hello.py" rows="1"></textarea>
            <button id="send">enviar</button>
        </div>
    </div>

    <script>
        const log = document.getElementById("log");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        let history = [];

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg" + role;
            const roleLabel = { user: "Você:", agent: "Agente:", error: "Erro:" }[role];
            div.innerHTML = `<span class="role">${roleLabel}</span>`;
            const body = document.createElement("div");
            body.textContent = text;
            div.appendChild(body);
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            return div;
        }

        function addActions(actions) {
            if (!actions || actions.length === 0) return;
            const box = document.createElement("div");
            box.className = "actions";
            for (const a of actions) {
                const line = document.createElement("div");
                line.className = "action-line";
                const argsStr = JSON.stringify(a.args || {});
                line.innerHTML = `<span class="cmd">${a.tool}</span> ${argsStr}`;
                box.appendChild(line);
            }
            log.appendChild(box);
            log.scrollTop = log.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            sendBtn.disabled = true;
            addMessage("user", text);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ message: text, history })
                });
                const data = await res.json();
                if (data.error) {
                    addActions(data.actions);
                    addMessage("error", data.error);
                } else {
                    addActions(data.actions);
                    addMessage("agent", data.reply || "(sem resposta de texto)");
                    history = data.history;
                }
            } catch (err) {
                addMessage("error", err.message);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener("click", send);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        addMessage("agent", "Pronto. Posso listar, ler, criar/editar e rodar arquivos dentro de workspace/. O que você quer que eu faça?");
    </script>
</body>
</html>
